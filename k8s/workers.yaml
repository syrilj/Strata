# Simulated training workers (Dockerfile.worker). Scale with replicas or the HPA.
# Each pod gets a stable WORKER_ID; COORDINATOR_URL uses in-cluster DNS.
# Build/push first: docker build -f Dockerfile.worker -t <registry>/strata-worker:latest .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers
  namespace: strata
  labels:
    app.kubernetes.io/name: strata
    app.kubernetes.io/component: worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strata
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: strata-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: COORDINATOR_URL
              value: "coordinator.strata.svc.cluster.local:50051"
            - name: GPU_COUNT
              value: "4"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
# Autoscale workers on CPU; coordinator stays at 1 (not HA).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workers
  namespace: strata
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workers
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
