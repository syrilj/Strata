# Persistent storage for local-backend checkpoints.
# Required: the coordinator always writes checkpoints to local disk. S3 is not
# wired into the coordinator yet (STORAGE_BACKEND=s3 falls back to local).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkpoint-data
  namespace: strata
  labels:
    app.kubernetes.io/name: strata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
