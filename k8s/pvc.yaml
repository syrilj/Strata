# Persistent storage for local-backend checkpoints.
# Not needed when STORAGE_BACKEND=s3 (then this PVC can be dropped).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkpoint-data
  namespace: strata
  labels:
    app.kubernetes.io/name: strata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
