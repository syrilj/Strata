# Coordinator: gRPC :50051 + HTTP API :51051 + dashboard :3000 (one image serves all three).
# Single replica by design — the coordinator is not HA yet (see README limitations).
# Build/push the image first: docker build -t <registry>/strata-coordinator:latest .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: strata
  labels:
    app.kubernetes.io/name: strata
    app.kubernetes.io/component: coordinator
spec:
  replicas: 1
  strategy:
    type: Recreate # single writer to the checkpoint PVC
  selector:
    matchLabels:
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strata
        app.kubernetes.io/component: coordinator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: coordinator
          image: strata-coordinator:latest
          imagePullPolicy: IfNotPresent
          args: ["0.0.0.0:50051"]
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 51051
            - name: dashboard
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: strata-config
          env:
            # S3 settings are optional — only set STORAGE_BACKEND=s3 with secret.yaml applied.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: strata-aws
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: strata-aws
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: strata-aws
                  key: AWS_REGION
                  optional: true
            - name: CHECKPOINT_BUCKET
              valueFrom:
                secretKeyRef:
                  name: strata-aws
                  key: CHECKPOINT_BUCKET
                  optional: true
          volumeMounts:
            - name: checkpoints
              mountPath: /data/checkpoints
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: checkpoint-data
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: strata
  labels:
    app.kubernetes.io/name: strata
    app.kubernetes.io/component: coordinator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: coordinator
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: http
      port: 51051
      targetPort: http
    - name: dashboard
      port: 3000
      targetPort: dashboard
