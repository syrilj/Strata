# Template for S3 credentials. Do NOT commit filled values.
# Copy to secret.yaml, fill in, apply:
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
# secret.yaml is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: strata-aws
  namespace: strata
  labels:
    app.kubernetes.io/name: strata
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  AWS_REGION: "us-east-1"
  CHECKPOINT_BUCKET: "REPLACE_ME"
